[package]
name = "gg-cli"
version = "0.10.11-dev"
edition = "2021"
description = "CLI binary for git-gud (gg) stacked-diffs tool"
authors = ["Nacho Lopez"]
license = "MIT"
repository = "https://github.com/mrmans0n/git-gud"

[package.metadata.dist]
formula = "gg-stack"

[[bin]]
name = "gg"
path = "src/main.rs"

[dependencies]
gg-core = { path = "../gg-core" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
console = "0.16"

[dev-dependencies]
nix = { version = "0.32", features = ["process", "signal"] }
tempfile = "3"
serde_json = "1"
